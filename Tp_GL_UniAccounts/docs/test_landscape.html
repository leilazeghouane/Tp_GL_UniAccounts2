<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>UML Test</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 10mm;
        }
        @page landscape-sheet {
            size: A4 landscape;
            margin: 6mm 8mm 6mm 8mm;
        }
        .landscape-page {
            page: landscape-sheet;
            break-before: page;
            break-after: page;
        }
        body { font-family: sans-serif; }
    </style>
</head>
<body>
    <div>Page 1 portrait</div>
    <div class="landscape-page">
        <h2 style="text-align:center; margin:0 0 4px 0; color:#1a365d;">المخطط الشامل للأنماط البرمجية (Full Comprehensive UML Diagram)</h2>
        <div style="width:100%; text-align:center;">
            <img src="images/full_comp_diagram.svg" style="width: 100%; max-height: 185mm;" alt="Full UML">
        </div>
    </div>
    <div>Page 3 portrait</div>
</body>
</html>
