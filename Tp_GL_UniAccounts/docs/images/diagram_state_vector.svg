<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 120" width="100%" height="auto" style="background:#ffffff; font-family:'Segoe UI', Tahoma, Arial, sans-serif;">
    <defs>
        <marker id="stArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#2b6cb0"/>
        </marker>
    </defs>

    <!-- Initial circle -->
    <circle cx="35" cy="45" r="11" fill="#2b6cb0"/>
    <path d="M 46 45 L 88 45" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#stArrow)"/>
    <text x="67" y="37" text-anchor="middle" font-size="8" font-weight="bold" fill="#4a5568">new Account</text>

    <!-- PENDING -->
    <rect x="95" y="24" width="125" height="42" rx="7" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.8"/>
    <text x="157" y="49" text-anchor="middle" font-size="12" font-weight="bold" fill="#c05621">PENDING</text>
    <text x="157" y="61" text-anchor="middle" font-size="7.5" fill="#7b341e">في انتظار التفعيل</text>

    <!-- PENDING -> ACTIVE -->
    <path d="M 220 45 L 278 45" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#stArrow)"/>
    <text x="250" y="37" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2b6cb0">activate()</text>

    <!-- ACTIVE -->
    <rect x="285" y="24" width="125" height="42" rx="7" fill="#f0fff4" stroke="#38a169" stroke-width="1.8"/>
    <text x="347" y="49" text-anchor="middle" font-size="12" font-weight="bold" fill="#276749">ACTIVE</text>
    <text x="347" y="61" text-anchor="middle" font-size="7.5" fill="#22543d">حساب مفعّل نشط</text>

    <!-- ACTIVE -> SUSPENDED -->
    <path d="M 410 36 L 493 36" stroke="#e53e3e" stroke-width="1.8" marker-end="url(#stArrow)"/>
    <text x="452" y="28" text-anchor="middle" font-size="8" font-weight="bold" fill="#e53e3e">suspend()</text>

    <!-- SUSPENDED -> ACTIVE -->
    <path d="M 495 54 L 418 54" stroke="#38a169" stroke-width="1.8" marker-end="url(#stArrow)"/>
    <text x="452" y="67" text-anchor="middle" font-size="8" font-weight="bold" fill="#38a169">activate()</text>

    <!-- SUSPENDED -->
    <rect x="500" y="24" width="125" height="42" rx="7" fill="#fff5f5" stroke="#e53e3e" stroke-width="1.8"/>
    <text x="562" y="49" text-anchor="middle" font-size="12" font-weight="bold" fill="#9b2c2c">SUSPENDED</text>
    <text x="562" y="61" text-anchor="middle" font-size="7.5" fill="#742a2a">معلّق مؤقتاً</text>

    <!-- ACTIVE / SUSPENDED -> CLOSED -->
    <path d="M 347 66 L 347 100 L 638 100" stroke="#4a5568" stroke-width="1.5" marker-end="url(#stArrow)"/>
    <text x="470" y="94" text-anchor="middle" font-size="8" font-weight="bold" fill="#4a5568">close() [التخرج أو الفصل النهائي]</text>

    <!-- CLOSED -->
    <rect x="645" y="78" width="85" height="38" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="1.8"/>
    <text x="687" y="102" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d3748">CLOSED</text>

    <!-- Final State circle -->
    <circle cx="687" cy="45" r="12" fill="#fff" stroke="#2d3748" stroke-width="1.6"/>
    <circle cx="687" cy="45" r="7" fill="#2d3748"/>
    <path d="M 687 78 L 687 63" stroke="#4a5568" stroke-width="1.5" marker-end="url(#stArrow)"/>
</svg>
